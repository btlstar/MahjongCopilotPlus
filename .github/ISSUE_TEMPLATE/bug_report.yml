name: 错误报告
description: 报告可复现的错误
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿填写 API Key、账户密钥、Token 或证书私钥。提交日志前先检查个人信息。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 源码提交号、Tag 或实际使用版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 版本、Python 版本、AI 来源；不要填写凭据
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
